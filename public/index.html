  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>StudyApp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#5b5bf0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
</head>

<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div id="login-screen" class="screen">
    <div class="login-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <button id="lang-toggle-login" class="lang-toggle">🌐 EN</button>

    <div class="login-shell">
      <div class="login-showcase">
        <div class="showcase-badge">✨ v0.1.6</div>
        <h1 class="showcase-title" data-i18n-html="showcase_title"></h1>
        <p class="showcase-text" data-i18n="showcase_text"></p>
        <div class="showcase-stats">
          <div class="showcase-stat"><strong>5</strong><span data-i18n="stat_modules"></span></div>
          <div class="showcase-stat"><strong>1</strong><span data-i18n="stat_click"></span></div>
          <div class="showcase-stat"><strong>0</strong><span data-i18n="stat_ads"></span></div>
        </div>
      </div>

      <div class="login-card">
        <div class="logo">📘</div>
        <h1 data-i18n="app_name"></h1>
        <p class="subtitle" data-i18n="login_subtitle"></p>

        <div class="auth-tabs">
          <button class="auth-tab-btn active" data-auth="login" data-i18n="login_tab"></button>
          <button class="auth-tab-btn" data-auth="register" data-i18n="register_tab"></button>
        </div>

        <form id="login-form" class="auth-form active">
          <input type="text" id="login-identifier" data-i18n-ph="login_identifier_ph" required autocomplete="username">
          <input type="password" id="login-password" data-i18n-ph="login_password_ph" required
            autocomplete="current-password">
          <div id="login-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="login_submit"></button>
        </form>

        <form id="register-form" class="auth-form">
          <input type="text" id="register-name" data-i18n-ph="register_name_ph" required autocomplete="name">
          <input type="email" id="register-email" data-i18n-ph="register_email_ph" required autocomplete="email">
          <input type="password" id="register-password" data-i18n-ph="register_password_ph" required
            autocomplete="new-password">
          <select id="register-level">
            <option value="facultate" data-i18n="level_university"></option>
            <option value="liceu" data-i18n="level_highschool"></option>
          </select>
          <div id="register-error" class="form-error hidden"></div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="register_submit"></button>
        </form>

        <div class="divider"><span data-i18n="or_divider"></span></div>

        <div class="oauth-buttons">
          <button id="google-login-btn" class="btn btn-oauth">
            <span class="oauth-icon">G</span> <span data-i18n="google_btn"></span>
          </button>
          <button id="apple-login-btn" class="btn btn-oauth btn-oauth-disabled">
            <span class="oauth-icon">🍎</span> <span data-i18n="apple_btn"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== APP SHELL ===== -->
  <div id="app" class="screen hidden">

    <aside class="sidebar">
      <button id="logo-home-sidebar" class="sidebar-logo logo-link" title="Home">
        <span class="logo-sm">📘</span>
        <span class="app-name" data-i18n="app_name"></span>
      </button>
      <nav class="sidebar-nav">
        <button class="tab-btn active" data-tab="home"><span>🏠</span><small data-i18n="nav_home"></small></button>
        <button class="tab-btn" data-tab="notes"><span>📝</span><small data-i18n="nav_notes"></small></button>
        <button class="tab-btn" data-tab="courses"><span>📚</span><small data-i18n="nav_courses"></small></button>
        <button class="tab-btn" data-tab="tasks"><span>✅</span><small data-i18n="nav_tasks"></small></button>
        <button class="tab-btn" data-tab="grades"><span>🎓</span><small data-i18n="nav_grades"></small></button>
        <button class="tab-btn" data-tab="summary"><span>📊</span><small data-i18n="nav_summary"></small></button>
        <button class="tab-btn" data-tab="schedule"><span>🗓️</span><small data-i18n="nav_schedule"></small></button>
      </nav>
      <div class="sidebar-footer">
        <button id="lang-toggle-sb" class="btn-icon" title="Language">🌐</button>
        <button id="theme-toggle-sb" class="btn-icon" title="Theme">🌙</button>
        <button id="settings-btn-sb" class="btn-icon" title="Settings">⚙</button>
        <button id="logout-btn-sb" class="btn-icon" title="Logout">⎋</button>
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar" id="topbar">
        <div class="topbar-left">
          <button id="logo-home-topbar" class="logo-link mobile-only" title="Home">
            <span class="logo-sm">📘</span>
            <span class="app-name" data-i18n="app_name"></span>
          </button>
        </div>
        <div class="topbar-right">
          <button id="wallet-pill" class="wallet-pill" title="Shop">
            <span class="wallet-icon">🪙</span>
            <span id="wallet-balance">—</span>
          </button>
          <span id="role-badge" class="role-badge hidden">Admin</span>
          <span id="greeting" class="greeting"></span>
          <div id="user-avatar-wrap" class="user-avatar-wrap">
            <div id="user-avatar" class="user-avatar"></div>
          </div>
          <button id="lang-toggle" class="btn-icon" title="Language">🌐</button>
          <button id="theme-toggle" class="btn-icon" title="Theme">🌙</button>
          <button id="settings-btn" class="btn-icon" title="Settings">⚙</button>
          <button id="logout-btn" class="btn-icon" title="Logout">⎋</button>
        </div>
      </header>

      <main class="content" id="swipe-area">

        <!-- ---- HOME ---- -->
        <section id="tab-home" class="tab active">
          <div class="hero-card">
            <div class="hero-text">
              <span class="hero-eyebrow" id="home-date"></span>
              <h2 class="hero-title" id="hero-greeting"></h2>
              <p class="hero-sub" id="hero-sub"></p>
            </div>
            <div class="hero-stats" id="hero-stats"></div>
          </div>

          <div id="daily-bonus-card" class="daily-bonus-card hidden">
            <div class="daily-bonus-left">
              <span class="daily-bonus-icon">🎁</span>
              <div>
                <strong data-i18n="daily_bonus_title"></strong>
                <p class="muted" data-i18n="daily_bonus_text"></p>
              </div>
            </div>
            <button id="claim-daily-bonus-btn" class="btn btn-primary" data-i18n="daily_bonus_claim"></button>
          </div>

          <div class="section-block">
            <div class="section-heading">
              <h3 data-i18n="section_my_courses"></h3>
              <div class="carousel-arrows">
                <button class="arrow-btn" id="courses-carousel-prev">‹</button>
                <button class="arrow-btn" id="courses-carousel-next">›</button>
              </div>
            </div>
            <div class="carousel" id="home-courses-carousel"></div>
          </div>

          <div class="card schedule-preview-card">
            <h3 data-i18n="schedule_preview_title"></h3>
            <div id="home-schedule-preview" class="list"></div>
          </div>

          <div class="bento-grid">
            <div class="card bento-tall">
              <h3 data-i18n="section_today_tasks"></h3>
              <div id="home-today-tasks" class="list"></div>
            </div>
            <div class="card">
              <h3 data-i18n="section_recent_notes"></h3>
              <div id="home-recent-notes" class="list"></div>
            </div>
          </div>
        </section>

        <!-- ---- NOTES (notebook) ---- -->
        <section id="tab-notes" class="tab">
          <div class="notes-layout">
            <aside class="notes-sidebar">
              <button id="new-note-btn" class="btn btn-primary btn-block" data-i18n="new_note_btn"></button>
              <div id="notes-list" class="list scrollable"></div>
            </aside>
            <div class="notes-canvas-wrap">
              <div class="canvas-toolbar">
                <input type="text" id="note-title" data-i18n-ph="note_title_ph">
                <select id="note-course"></select>
                <button id="delete-note-btn" class="btn-icon" title="Delete">🗑</button>
              </div>
              <textarea id="note-content" class="canvas"></textarea>
              <div class="save-indicator" id="save-indicator"></div>
            </div>
          </div>
        </section>

        <!-- ---- COURSES ---- -->
        <section id="tab-courses" class="tab">
          <div class="page-header">
            <h2 class="page-title" data-i18n="page_courses"></h2>
            <button id="new-course-btn" class="btn btn-primary" data-i18n="new_course_btn"></button>
          </div>
          <div id="courses-grid" class="card-grid"></div>
        </section>

        <!-- ---- TASKS ---- -->
        <section id="tab-tasks" class="tab">
          <div class="page-header">
            <h2 class="page-title" data-i18n="page_tasks"></h2>
            <div class="header-actions">
              <button id="sync-moodle-btn" class="btn btn-secondary" data-i18n="sync_moodle_btn"></button>
              <button id="import-ics-btn" class="btn btn-secondary" data-i18n="import_ics_btn"></button>
              <button id="new-task-btn" class="btn btn-primary" data-i18n="new_task_btn"></button>
            </div>
          </div>
          <div class="filters">
            <select id="task-filter-course">
              <option value="all" data-i18n="filter_all_courses"></option>
            </select>
            <select id="task-filter-status">
              <option value="all" data-i18n="filter_all"></option>
              <option value="todo" data-i18n="filter_todo"></option>
              <option value="done" data-i18n="filter_done"></option>
            </select>
          </div>
          <div id="tasks-list" class="list"></div>
        </section>

        <!-- ---- GRADES (note ponderate) ---- -->
        <section id="tab-grades" class="tab">
          <div class="page-header">
            <h2 class="page-title" data-i18n="nav_grades"></h2>
            <select id="grades-course-select" class="grades-course-select"></select>
          </div>
          <div id="grades-empty-state" class="empty-state hidden" data-i18n="empty_no_courses_full"></div>
          <div id="grades-body" class="hidden">
            <div class="card grades-summary-card">
              <div class="grades-summary-left">
                <span class="muted" data-i18n="weighted_average"></span>
                <div class="grades-average" id="grades-average">—</div>
              </div>
              <div class="grades-summary-right" id="grades-weight-warning"></div>
            </div>

            <div class="card chart-card">
              <h3 data-i18n="chart_evolution_title"></h3>
              <div id="chart-empty-state" class="empty-state hidden" data-i18n="chart_no_data"></div>
              <div class="chart-wrap"><canvas id="grades-chart"></canvas></div>
            </div>

            <div class="page-header">
              <h3 style="margin:0;font-size:15px" data-i18n="grading_section_title"></h3>
              <button id="add-category-btn" class="btn btn-secondary" data-i18n="add_category_btn"></button>
            </div>
            <div id="categories-list" class="categories-list"></div>
          </div>
        </section>

        <!-- ---- SUMMARY (rezumat pe perioadă) ---- -->
        <section id="tab-summary" class="tab">
          <div class="page-header">
            <div>
              <h2 class="page-title" data-i18n="page_summary" style="margin-bottom:4px"></h2>
              <p class="muted" data-i18n="summary_subtitle"></p>
            </div>
          </div>A
          <div id="summary-empty-state" class="empty-state hidden" data-i18n="no_periods_yet"></div>
          <div id="summary-body"></div>
        </section>
        <!-- ---- SCHEDULE (orar) ---- -->
        <section id="tab-schedule" class="tab">
          <div class="page-header">
            <h2 class="page-title" data-i18n="page_schedule"></h2>
            <div class="header-actions">
              <button class="btn btn-secondary schedule-view-btn active"
  data-schedule-view="classic"
  data-i18n="schedule_view_classic"></button>

<button class="btn btn-secondary schedule-view-btn"
  data-schedule-view="dynamic"
  data-i18n="schedule_view_dynamic"></button>
              <button id="export-schedule-btn" class="btn btn-secondary" data-i18n="schedule_export"></button>
              <label class="btn btn-secondary" for="import-schedule-input" data-i18n="schedule_import"></label>
              <input id="import-schedule-input" type="file" accept="application/json" hidden>
              <button id="new-schedule-entry-btn" class="btn btn-primary" data-i18n="new_schedule_entry_btn"></button>
            </div>
          </div>
          <div class="schedule-filters">
            <button class="schedule-filter-btn active" data-schedule-filter="all"
              data-i18n="schedule_filter_all"></button>
            <button class="schedule-filter-btn" data-schedule-filter="curs" data-i18n="schedule_filter_curs"></button>
            <button class="schedule-filter-btn" data-schedule-filter="seminar"
              data-i18n="schedule_filter_seminar"></button>
            <button class="schedule-filter-btn" data-schedule-filter="lab" data-i18n="schedule_filter_lab"></button>
            <button class="schedule-filter-btn" data-schedule-filter="ora" data-i18n="schedule_filter_ora"></button>
          </div>
          <div id="schedule-carousel-nav" class="schedule-carousel-nav hidden">
            <button id="schedule-prev-day-btn" class="btn-icon" title="" data-i18n="schedule_prev_day">‹</button>
            <div id="schedule-current-day-label" class="schedule-current-day-label"></div>
            <button id="schedule-next-day-btn" class="btn-icon" title="" data-i18n="schedule_next_day">›</button>
          </div>
          <div id="ad-banner-slot" class="ad-banner-slot">
            <span data-i18n="ad_banner_placeholder"></span>
          </div>
          <div id="schedule-grid" class="schedule-grid"></div>
        </section>

      </main>
    </div>

    <nav class="tabbar">
      <button class="tab-btn active" data-tab="home"><span>🏠</span><small data-i18n="nav_home"></small></button>
      <button class="tab-btn" data-tab="notes"><span>📝</span><small data-i18n="nav_notes"></small></button>
      <button class="tab-btn" data-tab="courses"><span>📚</span><small data-i18n="nav_courses"></small></button>
      <button class="tab-btn" data-tab="tasks"><span>✅</span><small data-i18n="nav_tasks"></small></button>
      <button class="tab-btn" data-tab="grades"><span>🎓</span><small data-i18n="nav_grades"></small></button>
      <button class="tab-btn" data-tab="summary"><span>📊</span><small data-i18n="nav_summary"></small></button>
      <button class="tab-btn" data-tab="schedule"><span>🗓️</span><small data-i18n="nav_schedule"></small></button>
    </nav>
  </div>

  <!-- ===== MODALS ===== -->
  <div id="modal-overlay" class="modal-overlay hidden">

    <div id="modal-course" class="modal hidden">
      <h3 id="course-modal-title" data-i18n="new_course_btn"></h3>
      <input type="text" id="course-name" data-i18n-ph="course_name_ph">
      <input type="text" id="course-professor" data-i18n-ph="course_professor_ph">
      <label class="color-label"><span data-i18n="color_label"></span>
        <input type="color" id="course-color" value="#5b5bf0">
      </label>
      <label class="color-label"><span data-i18n="period_label"></span></label>
      <select id="course-period"></select>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal data-i18n="modal_cancel"></button>
        <button id="save-course-btn" class="btn btn-primary" data-i18n="modal_save"></button>
      </div>
    </div>

    <div id="modal-task" class="modal hidden">
      <h3 data-i18n="new_task_btn"></h3>
      <input type="text" id="task-title" data-i18n-ph="task_title_ph">
      <select id="task-course"></select>
      <select id="task-type">
        <option value="tema" data-i18n="task_type_homework"></option>
        <option value="examen" data-i18n="task_type_exam"></option>
        <option value="proiect" data-i18n="task_type_project"></option>
        <option value="checklist" data-i18n="task_type_checklist"></option>
      </select>
      <input type="date" id="task-due-date">
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal data-i18n="modal_cancel"></button>
        <button id="save-task-btn" class="btn btn-primary" data-i18n="modal_save"></button>
      </div>
    </div>

    <div id="modal-course-detail" class="modal hidden">
      <h3 id="course-detail-name"></h3>
      <p id="course-detail-professor" class="muted"></p>
      <label class="color-label"><span data-i18n="period_label"></span></label>
      <select id="course-detail-period"></select>
